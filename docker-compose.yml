name: super-bot

x-app-environment: &app-environment
  SUPERBOT_ENVIRONMENT: production
  SUPERBOT_DATABASE_URL: postgresql+asyncpg://superbot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/superbot
  SUPERBOT_REDIS_URL: redis://valkey:6379/0
  SUPERBOT_S3_ENDPOINT_URL: http://seaweedfs:8333
  SUPERBOT_S3_BUCKET: superbot-artifacts
  SUPERBOT_S3_ACCESS_KEY_REF: env:SUPERBOT_S3_ACCESS_KEY
  SUPERBOT_S3_SECRET_KEY_REF: env:SUPERBOT_S3_SECRET_KEY
  SUPERBOT_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  SUPERBOT_S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  SUPERBOT_BROWSER_GATEWAY_URL: http://browser-worker:8430
  SUPERBOT_DASHSCOPE_API_KEY: ${SUPERBOT_DASHSCOPE_API_KEY:-}
  SUPERBOT_DEEPSEEK_API_KEY: ${SUPERBOT_DEEPSEEK_API_KEY:-}
  SUPERBOT_MOONSHOT_API_KEY: ${SUPERBOT_MOONSHOT_API_KEY:-}
  SUPERBOT_ZHIPU_API_KEY: ${SUPERBOT_ZHIPU_API_KEY:-}
  SUPERBOT_MINIMAX_API_KEY: ${SUPERBOT_MINIMAX_API_KEY:-}
  SUPERBOT_SILICONFLOW_API_KEY: ${SUPERBOT_SILICONFLOW_API_KEY:-}

x-app-security: &app-security
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m

x-app-dependencies: &app-dependencies
  postgres:
    condition: service_healthy
  valkey:
    condition: service_healthy
  seaweedfs:
    condition: service_healthy

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: superbot
      POSTGRES_USER: superbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U superbot -d superbot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.1-alpine
    command: [valkey-server, --appendonly, "yes", --save, "60", "1"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.38
    command: [server, -s3, -dir=/data, -s3.port=8333, -filer.port=8888]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    <<: *app-security
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: *app-environment
    command: [sh, -c, "alembic -c apps/api/alembic.ini upgrade head && exec uvicorn superbot_api.main:app --host 0.0.0.0 --port 8420"]
    depends_on: *app-dependencies
    ports:
      - "127.0.0.1:${SUPERBOT_API_PORT:-8420}:8420"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8420/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}
    restart: unless-stopped

  worker:
    <<: *app-security
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      <<: *app-environment
      SUPERBOT_WORKER_ROLE: worker
    command: [python, -m, superbot_worker.service, --role, worker]
    depends_on:
      <<: *app-dependencies
      api:
        condition: service_healthy
    volumes:
      - bot-workspaces:/workspaces
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; raise SystemExit(not Path('/tmp/superbot-worker.ready').exists())"]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "4.0", memory: 4G}
    restart: unless-stopped

  scheduler:
    <<: *app-security
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      <<: *app-environment
      SUPERBOT_WORKER_ROLE: scheduler
    command: [python, -m, superbot_worker.service, --role, scheduler]
    depends_on:
      <<: *app-dependencies
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; raise SystemExit(not Path('/tmp/superbot-scheduler.ready').exists())"]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}
    restart: unless-stopped

  browser-worker:
    <<: *app-security
    profiles: [browser]
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      <<: *app-environment
      SUPERBOT_WORKER_ROLE: browser
      SUPERBOT_PLAYWRIGHT_WS_ENDPOINT: ws://playwright-server:3000/
      SUPERBOT_BROWSER_GATEWAY_HOST: 0.0.0.0
      SUPERBOT_BROWSER_GATEWAY_PORT: 8430
      SUPERBOT_BROWSER_TRUSTED_DNS_PROXY_CIDRS: ${SUPERBOT_BROWSER_TRUSTED_DNS_PROXY_CIDRS:-}
    command: [python, -m, superbot_worker.service, --role, browser]
    depends_on:
      <<: *app-dependencies
      api:
        condition: service_healthy
      playwright-server:
        condition: service_healthy
    volumes:
      - bot-workspaces:/workspaces
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8430/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}
    restart: unless-stopped
    expose: [8430]

  playwright-server:
    image: superbot/playwright-server:1.61.0
    build:
      context: .
      dockerfile: Dockerfile.playwright
    profiles: [browser]
    init: true
    user: pwuser
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    shm_size: 1gb
    working_dir: /home/pwuser
    command: [run-server, --port, "3000", --host, 0.0.0.0]
    expose: [3000]
    healthcheck:
      test: [CMD, node, -e, "const n=require('net').connect(3000,'127.0.0.1');n.on('connect',()=>{n.end();process.exit(0)});n.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}
    restart: unless-stopped

volumes:
  postgres-data:
  valkey-data:
  seaweedfs-data:
  bot-workspaces:
