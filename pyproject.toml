[project]
name = "super-bot"
version = "0.1.0"
description = "Open persistent AI teammate platform"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "aiosqlite>=0.21.0",
  "alembic>=1.19.1",
  "asyncpg>=0.30.0",
  "boto3>=1.40.0",
  "croniter>=6.0.0",
  "fastapi>=0.117.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.2",
  "redis>=6.4.0",
  "sqlalchemy[asyncio]>=2.0.43",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
pythonpath = ["apps/api", "apps/worker"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/superbot_api", "apps/worker/superbot_worker"]
